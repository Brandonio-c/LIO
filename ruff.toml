# Lint/format settings for all Python in the repo (software/host, tools).
# Excluded: CAD scripts, electronics doc generators, and software/control (must not be modified).
line-length = 100
target-version = "py310"
extend-exclude = [
  "CAD",
  "electronics",
  "software/control",
  "software/firmware/legacy",
  "software/logger/legacy",  # the original TEST_MODE 5 logger, kept unchanged
]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[lint.isort]
known-first-party = ["lio"]
