[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lio"
version = "0.2.0"
description = "Host library, simulator and system test suite for the LIO V3 optical instrument"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "pyserial>=3.5",
  "pyyaml>=6.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "jinja2>=3.1",
]

[project.optional-dependencies]
# Food library: decode barcode photos, store photos, QR code for pairing phones
foods = [
  "zxing-cpp>=2.2",
  "pillow>=10",
  "segno>=1.6",
]
# Verifiable composition records (lio_comp, lio_verify; docs/COMPOSITION_VERIFICATION.md)
comp = [
  "lxml>=5",
  "jsonschema>=4.21",
  "z3-solver==5.4.1.0",  # pinned: bound witnesses in composition/records must rebuild byte-identically
  "lark>=1.1",
]
dev = [
  "pytest>=8",
  "pytest-timeout>=2.2",
  "pytest-cov>=5",
  "ruff==0.15.4",
  "mypy>=1.10",
  "types-PyYAML",
  "types-pyserial",
  "hypothesis>=6.100",
]

[project.scripts]
lio = "lio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lio_verify = ["py.typed"]
lio_comp = ["py.typed"]
lio = ["py.typed", "templates/*", "dashboard/static/*", "foods/static/*", "foods/swift/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
markers = [
  "unit: pure logic, no device",
  "sim: runs against the simulator (or hardware when --lio-port is given)",
  "hw: needs real hardware (--lio-port)",
  "interactive: needs an operator (--interactive)",
  "motion: moves the motors (--allow-motion, operator present)",
]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/lio", "src/lio_comp", "src/lio_verify"]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "zxingcpp.*", "segno.*", "z3.*", "lark.*", "jsonschema.*", "lxml.*"]
ignore_missing_imports = true
