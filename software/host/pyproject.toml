[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lio"
version = "0.2.0"
description = "Host library, simulator and system test suite for the LIO V3 optical instrument"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "pyserial>=3.5",
  "pyyaml>=6.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-timeout>=2.2",
  "pytest-cov>=5",
  "ruff==0.15.4",
  "mypy>=1.10",
  "types-PyYAML",
  "types-pyserial",
]

[project.scripts]
lio = "lio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lio = ["py.typed", "templates/*", "dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
markers = [
  "unit: pure logic, no device",
  "sim: runs against the simulator (or hardware when --lio-port is given)",
  "hw: needs real hardware (--lio-port)",
  "interactive: needs an operator (--interactive)",
  "motion: moves the motors (--allow-motion, operator present)",
]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/lio"]

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true
