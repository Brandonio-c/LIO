name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.15.4"
      - run: ruff check .
      - run: ruff format --check .

  python:
    name: Host package (mypy + tests, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: software/host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: mypy
      - name: Unit + simulator system tests + fault-injection matrix
        shell: bash
        run: |
          set -o pipefail
          pytest -m "unit or sim" --lio-sim --results-dir=${{ runner.temp }}/lio-run \
            --cov=lio --cov-report=term --cov-report=xml 2>&1 | tee ${{ runner.temp }}/pytest.log
      # Annotations are readable without signing in to GitHub, unlike the job log.
      - name: Name the failing tests in annotations
        if: failure()
        shell: bash
        run: |
          grep -E "^(FAILED|ERROR) " ${{ runner.temp }}/pytest.log | sed 's/^/::error title=pytest::/' || true
          grep -E "^E  " ${{ runner.temp }}/pytest.log | head -20 | sed 's/^/::error title=pytest detail::/' || true
      - name: Upload the simulator run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lio-sim-run-py${{ matrix.python }}
          path: ${{ runner.temp }}/lio-run/results.json
          if-no-files-found: warn
      - name: Coverage gate (>= 90 % on protocol and analysis)
        run: coverage report --include="*/lio/protocol.py,*/lio/analysis.py" --fail-under=90

  firmware:
    name: Firmware compile + SRAM gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: arduino/setup-arduino-cli@v2
      - name: Install AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
      - name: Firmware v2 — new bootloader (atmega328)
        run: python tools/firmware_size_gate.py software/firmware/lio_firmware --fqbn arduino:avr:nano:cpu=atmega328 --max-sram-pct 75
      - name: Firmware v2 — old bootloader (atmega328old)
        run: python tools/firmware_size_gate.py software/firmware/lio_firmware --fqbn arduino:avr:nano:cpu=atmega328old --max-sram-pct 75
      - name: Firmware v2 — hardware watchdog build (new bootloader only)
        run: >
          python tools/firmware_size_gate.py software/firmware/lio_firmware
          --fqbn arduino:avr:nano:cpu=atmega328 --max-sram-pct 75
          --build-property "compiler.cpp.extra_flags=-DLIO_HW_WDT=1"
